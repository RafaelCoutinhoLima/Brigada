name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

  # The tests that touch Postgres: tenant scope, every MCP tool, write tools, run persistence.
  db:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: brigada
          POSTGRES_PASSWORD: brigada
          POSTGRES_DB: brigada
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U brigada" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://brigada:brigada@localhost:5432/brigada
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --frozen
      - name: Apply migrations
        run: for f in db/migrations/*.sql; do psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f "$f"; done
      - run: uv run python scripts/seed_data.py --reset --end-date 2026-10-27
      - run: uv run pytest -m db

  # The lakehouse pipeline transforms and the lakehouse tools' SQL on a local Spark (no
  # Databricks account): seed -> export -> bronze/silver/gold -> the tools' queries.
  lakehouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --frozen --extra lakehouse --group spark
      # A missing pyspark/pandas must fail this job, not turn every Spark test into a skip.
      - run: uv run pytest tests/lakehouse
        env:
          REQUIRE_SPARK: "1"

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -t brigada:ci .

  # Live eval gate, off until a model API key is set as a repository secret: runs the "ci"
  # subset against a real model and fails if accuracy drops more than 5 points below baseline.
  # evals:
  #   runs-on: ubuntu-latest
  #   needs: test
  #   env:
  #     ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  #     DATABASE_URL: ${{ secrets.DATABASE_URL }}
  #   steps:
  #     - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
  #     - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
  #     - run: uv sync --frozen
  #     - run: uv run python -m evals.run --subset ci --fail-under-baseline 5
