services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: brigada
      POSTGRES_PASSWORD: brigada
      POSTGRES_DB: brigada
    ports:
      - "${BRIGADA_DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brigada -d brigada"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
